name: dhyanlog
description: Meditation attendance app for the Heartfulness organization.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  geolocator: ^14.0.3
  http: ^1.2.0
  intl: any
  sentry_flutter: ^9.0.0
  shared_preferences: ^2.2.0
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n localization codegen (see l10n.yaml)
