name: Deploy edge function

# Deploys the routed `api` edge function on merge to main, and on demand.
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   — the target project ref (e.g. the prod project)
# The skip-if-unset guard means the workflow no-ops cleanly until secrets exist.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: supabase functions deploy api
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard — require deploy secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Deploy secrets not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: guard
      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          version: latest
      - name: Deploy
        if: steps.guard.outputs.skip != 'true'
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF"
